[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator-order-receipt-service"
version = "0.1.0"
description = "A typed Python service for paid creator orders, asset delivery, and receipt email."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/creator_receipts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
